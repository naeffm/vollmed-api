name: CI Voll Med

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Roda Docker Compose
        run: docker compose up -d

      - name: Executa testes unitarios
        run: mvn -B verify

      - name: Gera relatório Jacoco
        run: mvn jacoco:prepare-agent verify
        
      - name: Análise estática
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=naeffm_vollmed-api
